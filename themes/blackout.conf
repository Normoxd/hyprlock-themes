background {
    color = rgba(0, 0, 0, 1)
    }

general {
    ignore_empty_input = true
    hide_cursor = true
}

label {
    text = $TIME
    color = rgba(40, 40, 40, 0.07)
    font_size = 200
    font_family = Inter Bold
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    size = 145, 40
    outline_thickness = 0
    dots_size = 0.2
    rounding = 8
    dots_spacing = 0.9
    dots_center = false
    outer_color = rgba(1, 1, 1, 1)
    inner_color = rgba(40, 40, 40, 0.1)
    font_color = rgba(255, 255, 255, 0.4)
    fade_on_empty = true
    hide_input = false
    position = 0, 10
    halign = center
    valign = bottom
}
