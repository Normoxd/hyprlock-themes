# =====================
#  Mid  (By Normoxd)
# =====================

# ~~~ Background ~~~

background {
    path = $HOME/.config/hypr/background.png
    blur_passes = 0
}

# ~~~ General Settings ~~~

general {
    ignore_empty_input = true
    hide_cursor = true
}

# ~~~ Animations ~~~

animations {
    animation = fade,    1, 6, default
    animation = fadeIn,  1, 6, default
    animation = fadeOut, 1, 6, default
}

# ~~~ Clock & Date ~~~

# Time
label {
    text = $TIME
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = Adwaita Sans Bold
    position = 20, 55
    halign = left
    valign = bottom
}

    
# Date
label {
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.90)
    font_size = 25
    font_family = Adwaita Sans light
    position = 20, 20
    halign = left
    valign = bottom
}

# ~~~ Login Pane ~~~

# Window
shape {
    color = rgba(100, 114, 125, 0.4)
    size = 350, 120
    rounding = 13
    position = -20, 20
    halign = right
    valign = bottom
    zindex = 0
    }
    
# Profile Pic
image {
    path = $HOME/.config/hypr/user.png
    border_size = 0
    size = 100
    rounding = 13           # -1 = circle
    reload_time = -1
    reload_cmd = 
    position = -260, 30
    halign = right
    valign = bottom
    }
    
# Username
label {
    text = $USER
    color = rgba(216, 222, 233, 1)
    font_size = 20
    font_family = Adwaita Sans
    position = 1122, 87
    halign = left
    valign = bottom
}

# Password Input Field

input-field {
    size = 210, 40
    outline_thickness = 0
    dots_size = 0.2
    rounding = 8
    dots_spacing = 0.8
    dots_center = true
    outer_color = rgba(1, 1, 1, 0)
    inner_color = rgba(255, 255, 255, 0.2)
    font_color = rgb(212, 237, 255)
    fade_on_empty = false
    font_family = Adwaita Sans
    placeholder_text = <span foreground="##ffffff99">Password</span>
    hide_input = false
    position = -37, 37
    halign = right
    valign = bottom
}
